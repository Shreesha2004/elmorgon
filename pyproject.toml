[project]
name = "elmorgon"
version = "0.1.0"
description = "Day-ahead electricity price forecasting for Sweden's bidding zones"
readme = "README.md"
license = "MIT"
authors = [{ name = "Shreesha Vamanjoor Balakrishnan" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "dagster>=1.13",
    "dagster-dbt>=0.29",
    "dagster-webserver>=1.13",
    "dbt-core>=1.10",
    "dbt-duckdb>=1.9",
    "duckdb>=1.3",
    "holidays>=0.60",
    "httpx>=0.28",
    "jinja2>=3.1",
    "lightgbm>=4.5",
    "pandas>=2.2",
    "pyarrow>=18",
    "pydantic>=2.9",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "respx>=0.22", "ruff>=0.8"]

[project.scripts]
elmorgon = "elmorgon.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["elmorgon*", "orchestration*"]

[tool.dagster]
module_name = "orchestration.definitions"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets the tests import helpers from tests/conftest.py
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses: safe as default arguments.
extend-immutable-calls = ["elmorgon.schedule.EV", "elmorgon.schedule.Battery", "schedule.EV", "schedule.Battery"]
