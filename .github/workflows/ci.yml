name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        # Includes the point-in-time test, which builds the real dbt project on synthetic data.
        run: pytest --cov=elmorgon --cov-report=term --cov-fail-under=85

      - name: dbt project parses
        env:
          ELMORGON_DATA_DIR: ${{ runner.temp }}
        run: dbt parse --project-dir transform --profiles-dir transform
