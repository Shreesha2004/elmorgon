name: Daily forecast

# 08:00 UTC is 10:00 in Stockholm in summer and 09:00 in winter: always
# before the 12:00 CET auction closes, and well before prices publish at ~13:00.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      # Raw data and backtest results are cached between runs, so each day only
      # downloads what is new and the backtest is not recomputed daily.
      - uses: actions/cache@v4
        with:
          path: |
            data/bronze
            data/forecasts
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Ingest, build, forecast, export
        run: elmorgon daily

      - name: Backtest (first of the month, or when none exists yet)
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ ! -f data/forecasts/backtest_metrics.json ]; then
            elmorgon backtest && elmorgon site
          fi

      # The forecast log is append-only: each issued file is committed once and
      # never rewritten, so the history proves no forecast was edited after the fact.
      - name: Commit the issued forecast
        run: |
          git config user.name "elmorgon-bot"
          git config user.email "elmorgon-bot@users.noreply.github.com"
          git add forecasts/issued
          git diff --cached --quiet || git commit -m "Forecast issued $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: forecast
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
